[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csv2xlsx-report"
version = "0.1.0"
description = "Turn raw CSV exports into a formatted, reconciled Excel report with summary tabs and charts."
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "openpyxl>=3.1"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["csv2xlsx"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
